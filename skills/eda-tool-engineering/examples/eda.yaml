name: my_chip
top: chip_top
rtl:
  - rtl/chip_top.sv
  - rtl/**/*.sv
filelists:
  - sim/rtl.f
include_dirs:
  - rtl/include
defines: [SYNTHESIS]
pdk:
  root: /path/to/pdk/TSMC28
  target_library: lib/slow.db
constraints: constraints/chip.sdc
flows:
  sim:
    simulator: vcs
    tb: sim/tb_top.sv
    top: tb_top
    seed: 1
    coverage: false
  synth: {tool: dc}
  # Set this to a mapped gate-level netlist produced by the synthesis run.
  sta: {tool: pt, netlist: runs/<synth-run-id>/netlist.v}
  # URG can consume an existing VDB without rerunning simulation.
  coverage: {vdb: runs/<sim-run-id>/simv.vdb}
  # Planning-only flow in this implementation.
  apr: {tool: icc2, script: scripts/run_icc2.tcl}
dft:
  enabled: true
  scan: {chains: 8, compression: true}
  mbist: {enabled: true, controller: vendor_ip, config: dft/mbist.yml}
  lbist: {enabled: false, controller: vendor_ip}
  atpg: {faults: [stuck_at, transition], tool: tmax}

name: RTL PPA Python tests

on:
  pull_request:
    paths:
      - "skills/rtl-ppa-optimization/**"
      - "tests/rtl_ppa/**"
      - "skills/eda-tool-engineering/**"
      - "README.md"
      - "tests/test_*.py"
      - "aicflow"
      - "docs/architecture/**"
      - "docs/milestone1/**"
      - "docs/eda-adapter-capabilities.md"
      - ".github/workflows/rtl-ppa-python-tests.yml"
  push:
    paths:
      - "skills/rtl-ppa-optimization/**"
      - "tests/rtl_ppa/**"
      - "skills/eda-tool-engineering/**"
      - "README.md"
      - "tests/test_*.py"
      - "aicflow"
      - "docs/architecture/**"
      - "docs/milestone1/**"
      - "docs/eda-adapter-capabilities.md"
      - ".github/workflows/rtl-ppa-python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Run Python-only tests (PPA and EDA adapters)
        run: python -m pytest -q tests
